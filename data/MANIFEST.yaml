# MANIFEST.yaml — registro oficial dos dados da ApostaInfo
# ============================================================
# Fonte da verdade: Zoho WorkDrive (a partir de 2026-07-28).
#
# REGRA DE OURO: nenhum dado pode ter sua ÚNICA cópia numa máquina local.
# O diretório local é cache derivado e descartável — apagar `backend/data/` e rodar
# `python -m scripts.datastore_sync pull` deve restaurar tudo.
#
# CAMADAS
#   workdrive : arquivo grande / histórico / artefato. Fonte da verdade.
#   neon      : precisa de QUERY em runtime (WorkDrive é blob storage, não dá SELECT).
#   git       : pequeno e crítico no boot da produção — versionado + espelhado no WorkDrive.
#   derived   : reconstruível a partir de outros dados; sincronizado por conveniência.
#
# Toda entrada nova de dado no projeto DEVE ser registrada aqui.

version: 1
updated_at: "2026-07-28"
workdrive_root: "ApostaInfo/data"   # pasta raiz no WorkDrive (ZOHO_WORKDRIVE_FOLDER_ID)

datasets:

  # ---------------------------------------------------------------- raw / bruto
  - id: club_raw_cache
    path: backend/data/club_raw_cache.sqlite
    remote: raw/club_raw_cache.sqlite
    layer: workdrive
    size_mb: 583
    runtime_critical: false
    owner: coleta
    refresh: "cron prefetch_clubs.py (diário)"
    notes: >
      Espelho local do bruto de clubes (83 competições). Nunca puxar os blobs do Neon em
      runtime — usar este espelho. Era o maior ponto de falha: existia só numa máquina,
      o que travou o backfill em 2026-07-28.

  - id: selecao_raw_cache
    path: backend/data/raw_cache.sqlite
    remote: raw/raw_cache.sqlite
    layer: workdrive
    runtime_critical: false
    owner: coleta
    refresh: "cron prefetch_wc_data.py (diário)"

  # ---------------------------------------------------------- datasets de treino
  - id: dataset_selecao
    path: international_features_enriched_apifootball.csv
    remote: datasets/international_features_enriched_apifootball.csv
    layer: workdrive
    runtime_critical: false
    owner: modelagem
    refresh: "após cada coleta grande"
    notes: "Dataset de treino de seleções. Gitignored — hoje só existe local."

  - id: dataset_clubes
    path: backend/data/built/club_features_enriched.parquet
    remote: datasets/club_features_enriched.parquet
    layer: workdrive
    size_mb: 7
    runtime_critical: false
    owner: modelagem
    refresh: "build_clubs_dataset.py --stage all"
    notes: >
      ATENÇÃO: a cópia local (4 torneios/21k jogos) diverge da produção (72 torneios/273k).
      A versão do WorkDrive deve ser sempre a que gerou o artefato de produção vigente.

  # ------------------------------------------------------------------ odds reais
  - id: odds_datatest
    path: data-test/
    remote: odds/data-test/
    layer: workdrive
    size_mb: 11
    runtime_critical: false
    owner: pesquisa
    refresh: "download por temporada (football-data.co.uk)"
    notes: >
      Odds reais por casa (Max/Avg/casas individuais, abertura e fechamento).
      RESOLVIDO em 2026-07-30: o bloqueio de rede ao football-data.co.uk era da máquina
      onde o §24 rodou, não do domínio. Da máquina de coleta o download funcionou:
      `scripts/fetch_historical_odds.py --from 2010 --to 2026` trouxe 305 arquivos
      (33 MB, 16 temporadas × 22 divisões) em `data-test/historical/<temporada>/<div>.csv`.
      Resultado medido: 107.095 partidas com odds 1X2 (era 722) e 37.243 com as colunas
      Max/Avg e O/U 2.5 — acima do N≈19.400 que o §25.3 aponta como necessário para
      detectar um edge de 2%. Os 47 "faltantes" são 404 esperados (liga que não existia
      naquela temporada).

  - id: odds_snapshots
    path: backend/data/odds/
    remote: odds/snapshots/
    layer: workdrive
    runtime_critical: false
    owner: coleta
    refresh: "cron collect_{,club_}odds_forward.py (~3/3h)"
    notes: >
      CRÍTICO E HOJE PERDIDO: série temporal de odds por casa. Vive em .jsonl no disco do
      Render, que é efêmero → some a cada deploy. Sem este histórico não dá para medir CLV
      (closing line value), a métrica mais confiável de habilidade em apostas. Empurrar
      para o WorkDrive a cada execução do cron é o fix.

  - id: odds_history
    path: backend/data/odds_history.sqlite
    remote: odds/odds_history.sqlite
    layer: workdrive
    runtime_critical: false
    owner: coleta
    refresh: "cron collect_odds_backfill.py (a cada 3h, janela -7..+14)"
    notes: >
      Dataset DURÁVEL de odds (valores, não só metadados) da janela de retenção — é o que
      permite validar BTTS/escanteios/cartões e medir CLV. Só cresce para a frente: a
      API-Football não serve odd retroativa (verificado em 2026-07-30:
      `/odds?fixture=<jogo antigo>` e `/odds?league=&season=` voltam vazios), então cada
      dia não coletado é perda permanente. Até 2026-07-30 tinha só 12 fixtures porque o
      filtro de ligas ignorava as 83 competições de clube — corrigido (`--scope ambos`).

  - id: injuries
    path: backend/data/injuries.sqlite
    remote: raw/injuries.sqlite
    layer: workdrive
    runtime_critical: false
    owner: coleta
    refresh: "cron collect_injuries.py --current-only (diário); varredura completa manual"
    notes: >
      Lesões/desfalques por liga e temporada (`GET /injuries`), coletado em massa pela
      primeira vez em 2026-07-30. Retroativo: cada registro vem amarrado a um fixture_id,
      então serve para treinar, não só para prever. Custo ~600 chamadas para 83 ligas ×
      7 temporadas. ATENÇÃO à cobertura desigual — grandes europeias a partir de 2020/21,
      Brasileirão só a partir de 2024, Libertadores quase nada: qualquer feature derivada
      precisa tratar "sem dado" como categoria própria, nunca como "zero lesões".

  # ----------------------------------------------- artefatos de modelo (híbrido)
  - id: artifacts_selecao
    path: backend/model_artifacts/
    remote: artifacts/model_artifacts/
    layer: git            # + espelhado no workdrive
    size_mb: 44
    runtime_critical: true
    owner: modelagem
    notes: >
      Lido pelo Predictor em runtime. Decisão 2026-07-28: permanece no git (deploy sem
      dependência externa, boot rápido) E é espelhado no WorkDrive como fonte da verdade
      e versionamento histórico.

  - id: artifacts_clubes
    path: backend/model_artifacts_clubes/
    remote: artifacts/model_artifacts_clubes/
    layer: git            # + espelhado no workdrive
    size_mb: 76
    runtime_critical: true
    owner: modelagem

  - id: artifacts_frozen_2025
    path: backend/model_artifacts_clubes_2025frozen/
    remote: artifacts/model_artifacts_clubes_2025frozen/
    layer: workdrive
    size_mb: 5
    runtime_critical: false
    owner: pesquisa
    notes: "Modelo congelado (cutoff 2025-07-01) para backtest sem vazamento."

  # ---------------------------------------------------------- derivados/relatórios
  - id: backtest_intermediates
    path: backend/data/built/backtest_*.parquet
    remote: derived/backtest/
    layer: derived
    runtime_critical: false
    owner: pesquisa
    refresh: "backtest_odds_ingest → match_games → generate_predictions"

  - id: reports
    path: backend/data/reports/
    remote: reports/
    layer: workdrive
    runtime_critical: false
    owner: pesquisa
    notes: "Relatórios de hipóteses/baterias. Gitignored (backend/.gitignore: reports/)."

  - id: historico_completo
    path: data/built/historico_completo.json
    remote: raw/historico_completo.json
    layer: workdrive
    size_mb: 205
    runtime_critical: false
    owner: coleta

  - id: performance_public
    path: backend/data/reports/performance/
    remote: reports/performance/
    layer: git            # + espelhado
    runtime_critical: true
    owner: produto
    notes: "Servido pela página /desempenho via performance_service.py — precisa existir no deploy."

# ----------------------------------------------------------------- fica no Neon
# Não migrar: precisa de query em runtime.
neon_only:
  - tabelas de usuário/monetização (auth, wallet, payments, bets, promotions, affiliates…)
  - agregados "*_agg" (precompute_aggregates.py) servidos pelos endpoints
  - odds_bookmaker_latest / club_odds_bookmaker_latest (Verificador de Bets)
  - odds_registry / club_odds_registry (metadados de coleta)

# Blobs que DEVEM sair do Neon e ir para o WorkDrive (redução de custo/egress):
neon_to_migrate:
  - match_detail_cache        # blobs JSON brutos — já proibidos em runtime pela regra de ouro
  - club_match_detail_cache
